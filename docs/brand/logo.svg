<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- A NEW ONE: the ANO lettermark.
       Three condensed monoline letters. The A is pointed with a crossbar, so it
       shares nothing with the rounded Arc arch; the O is a coin seen mid-flip,
       with a rim inside it. Built to survive a 32 px listing thumbnail. -->
  <g fill="none" stroke="#00B877" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <!-- A -->
    <path d="M60 366 L108 146 L156 366"/>
    <path d="M76 300 H140"/>
    <!-- N -->
    <path d="M218 366 V146 L300 366 V146"/>
    <!-- O, the coin -->
    <ellipse cx="405" cy="256" rx="48" ry="110"/>
  </g>
  <!-- the coin's rim -->
  <ellipse cx="405" cy="256" rx="30" ry="92" fill="none" stroke="#00B877" stroke-opacity=".25" stroke-width="6"/>
</svg>
