<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- A NEW ONE: the A1 monogram. A for A NEW ONE, 1 for the ONE; together, A1.
       Two glyphs share one stroke: the 1 (deep tone) is a stem on a base with a
       short flag; the A (light tone) is a long leg and a crossbar that borrow
       the 1's stem as their right side. Generated by build-brand/a1.mjs. -->
  <defs>
    <clipPath id="leg"><rect x="0" y="92" width="512" height="300"/></clipPath>
    <clipPath id="flag"><polygon points="185.3,126.0 350.9,238.0 519.0,-10.4 353.4,-122.5"/><rect x="0" y="0" width="512" height="92"/></clipPath>
    <clipPath id="top"><rect x="0" y="92" width="512" height="512"/></clipPath>
  </defs>
  <!-- A: the leg -->
  <g clip-path="url(#leg)"><polygon points="338.6,26.1 68.4,425.4 116.4,457.9 386.6,58.6" fill="#00B877"/></g>
  <!-- A: the crossbar, from the leg to the stem -->
  <rect x="215.2" y="286" width="88.8" height="46" fill="#00B877"/>
  <!-- 1: the stem, shared with the A -->
  <rect x="300" y="92" width="58" height="300" fill="#007A50"/>
  <!-- 1: the base -->
  <rect x="267" y="392" width="124" height="30" fill="#007A50"/>
  <!-- 1: the flag, laid over the top of the A's leg -->
  <g clip-path="url(#top)"><g clip-path="url(#flag)"><polygon points="338.6,26.1 68.4,425.4 116.4,457.9 386.6,58.6" fill="#007A50"/></g></g>
</svg>
