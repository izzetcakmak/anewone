<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <!-- Horizontal lockup: the ANO lettermark tile and the wordmark.
       The wordmark is live text in Space Grotesk; embed the font or convert to
       outlines before using this file where the font is not installed. -->
  <rect x="40" y="40" width="240" height="240" rx="52" fill="#07080b"/>
  <g transform="translate(40 40) scale(0.46875)">
    <g fill="none" stroke="#00B877" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 366 L108 146 L156 366"/>
      <path d="M76 300 H140"/>
      <path d="M218 366 V146 L300 366 V146"/>
      <ellipse cx="405" cy="256" rx="48" ry="110"/>
    </g>
    <ellipse cx="405" cy="256" rx="30" ry="92" fill="none" stroke="#00B877" stroke-opacity=".25" stroke-width="6"/>
  </g>
  <text x="330" y="178" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700"
        font-size="132" letter-spacing="6" fill="#07080b">A NEW ONE</text>
  <text x="334" y="236" font-family="'Inter', system-ui, sans-serif" font-weight="500"
        font-size="34" letter-spacing="1" fill="#6b746f">Insert Coin. Launch a New One.</text>
</svg>
