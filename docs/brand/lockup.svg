  <svg x="40" y="40" width="240" height="240" viewBox="0 0 1024 1024" clip-path="url(#tileclip)">
  <rect width="1024" height="1024" fill="#0c0c0b"/>
  <g transform="translate(127 135) scale(7.7)">
    <path fill="#00e57a" fill-rule="evenodd" d="M50 10 L82 88 H18 Z M50 46 m-11.5 0 a11.5 11.5 0 1 1 23 0 a11.5 11.5 0 1 1 -23 0 M34 64 H66 V88 H34 Z"/>
  </g>
</svg>
  <text x="330" y="178" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" font-size="132" letter-spacing="6" fill="#07080b">A NEW ONE</text>
  <text x="334" y="236" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="34" letter-spacing="1" fill="#6b746f">Insert Coin. Launch a New One.</text>
