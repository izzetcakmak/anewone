<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6ec"/>
      <stop offset="1" stop-color="#fbe7d5"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3da"/>
      <stop offset="1" stop-color="#8fcabb"/>
    </linearGradient>
    <!-- hand-drawn wobble for fine linework -->
    <filter id="wob" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="3.5"/>
    </filter>
    <!-- bigger wobble for long strokes (rainbow, frame, waves) -->
    <filter id="wob2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
    </filter>
    <!-- soft paper grain -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.26  0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- sparkles -->
  <g stroke="#e3c79b" stroke-width="2.5" stroke-linecap="round" filter="url(#wob)">
    <path d="M42 148 v10 M37 153 h10"/>
    <path d="M362 176 v9 M357.5 180.5 h9"/>
    <path d="M330 64 v8 M326 68 h8"/>
    <circle cx="66" cy="200" r="2" fill="#e3c79b" stroke="none"/>
    <circle cx="348" cy="228" r="2" fill="#e3c79b" stroke="none"/>
  </g>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.85" filter="url(#wob)">
    <ellipse cx="72" cy="112" rx="26" ry="12"/>
    <ellipse cx="92" cy="104" rx="18" ry="10"/>
    <ellipse cx="54" cy="106" rx="14" ry="8"/>
    <ellipse cx="318" cy="130" rx="20" ry="9"/>
    <ellipse cx="334" cy="124" rx="13" ry="7"/>
  </g>

  <!-- dove with olive sprig -->
  <g filter="url(#wob)">
    <path d="M300 84 C 292 78 282 78 276 84 C 284 86 290 90 294 96" fill="none" stroke="#a4917a" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="306" cy="92" rx="11" ry="7.5" fill="#fffaf0" stroke="#a4917a" stroke-width="2.5"/>
    <path d="M304 90 C 300 96 292 99 286 98 C 292 102 300 102 306 99" fill="#f3e9d8" stroke="#a4917a" stroke-width="2"/>
    <circle cx="315" cy="87" r="5" fill="#fffaf0" stroke="#a4917a" stroke-width="2.5"/>
    <path d="M320 87 L 326 88.5 L 320 90 Z" fill="#e8b04b"/>
    <circle cx="316.5" cy="85.5" r="1" fill="#6b5a45"/>
    <path d="M326 88.5 C 332 84 338 82 344 83" fill="none" stroke="#7fa86b" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="336" cy="82" rx="4" ry="1.8" fill="#9ab973" transform="rotate(-18 336 82)"/>
    <ellipse cx="343" cy="81" rx="4" ry="1.8" fill="#9ab973" transform="rotate(-8 343 81)"/>
  </g>

  <!-- rainbow: ends dip into the sea -->
  <g fill="none" stroke-linecap="round" filter="url(#wob2)">
    <path d="M54 288 A 146 146 0 0 1 346 288" stroke="#f2a7b3" stroke-width="17"/>
    <path d="M72 288 A 128 128 0 0 1 328 288" stroke="#f8d49b" stroke-width="17"/>
    <path d="M90 288 A 110 110 0 0 1 310 288" stroke="#a9d8c5" stroke-width="17"/>
  </g>

  <!-- coin sun -->
  <g filter="url(#wob)" transform="translate(0,-18)">
    <circle cx="200" cy="150" r="46" fill="#fdf6ec"/>
    <g stroke="#eec488" stroke-width="3" stroke-linecap="round">
      <path d="M200 96 v-10"/>
      <path d="M238 112 l7 -7"/>
      <path d="M254 150 h10"/>
      <path d="M238 188 l7 7"/>
      <path d="M162 112 l-7 -7"/>
      <path d="M146 150 h-10"/>
      <path d="M162 188 l-7 7"/>
    </g>
    <circle cx="200" cy="150" r="40" fill="#8fb4e3" stroke="#5e83b6" stroke-width="3.5"/>
    <circle cx="200" cy="150" r="32" fill="none" stroke="#aecaee" stroke-width="2.5"/>
    <!-- hand-drawn $ (vector paths: identical on every device, no font needed) -->
    <g stroke="#fdf6ec" stroke-linecap="round" fill="none">
      <path d="M200 126 V 174" stroke-width="5"/>
      <path d="M213 139 C 208 131 192 130 187 138 C 182 147 194 151 201 152 C 212 154 217 163 209 169 C 201 175 188 172 184 164" stroke-width="7"/>
    </g>
  </g>

  <!-- sea -->
  <path d="M0 284 Q 40 276 80 284 T 160 284 T 240 284 T 320 284 T 400 284 V400 H0 Z" fill="url(#sea)" filter="url(#wob2)"/>

  <!-- animals peeking from the hull (drawn before hull so they sit behind the rail) -->
  <!-- giraffe pair -->
  <g filter="url(#wob)">
    <path d="M138 272 L 133 220" stroke="#f3cf8a" stroke-width="11" stroke-linecap="round"/>
    <circle cx="130" cy="230" r="1.9" fill="#cf9d55"/><circle cx="135" cy="246" r="2.2" fill="#cf9d55"/><circle cx="137" cy="262" r="1.9" fill="#cf9d55"/>
    <path d="M129 209 l-2 -8 M136 209 l2 -8" stroke="#b98c4e" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="127" cy="201" r="2.2" fill="#b98c4e"/><circle cx="138.5" cy="201" r="2.2" fill="#b98c4e"/>
    <ellipse cx="132.5" cy="214" rx="9" ry="8" fill="#f3cf8a"/>
    <ellipse cx="124" cy="213" rx="3.5" ry="2.2" fill="#e0b168" transform="rotate(-30 124 213)"/>
    <circle cx="130" cy="212" r="1.5" fill="#5b4630"/>
    <ellipse cx="127" cy="218" rx="3.6" ry="2.8" fill="#e0b168"/>
    <g transform="translate(-9,-6)">
      <path d="M155 278 L 159 224" stroke="#f3cf8a" stroke-width="11" stroke-linecap="round"/>
      <circle cx="160" cy="234" r="2" fill="#cf9d55"/><circle cx="156" cy="250" r="2.2" fill="#cf9d55"/><circle cx="154" cy="264" r="1.9" fill="#cf9d55"/>
      <path d="M156 213 l-2 -8 M163 213 l2 -8" stroke="#b98c4e" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="154" cy="205" r="2.2" fill="#b98c4e"/><circle cx="165.5" cy="205" r="2.2" fill="#b98c4e"/>
      <ellipse cx="159.5" cy="218" rx="9" ry="8" fill="#f3cf8a"/>
      <ellipse cx="168" cy="217" rx="3.5" ry="2.2" fill="#e0b168" transform="rotate(30 168 217)"/>
      <circle cx="162" cy="216" r="1.5" fill="#5b4630"/>
      <ellipse cx="165" cy="222" rx="3.6" ry="2.8" fill="#e0b168"/>
    </g>
  </g>
  <!-- elephant pair -->
  <g filter="url(#wob)">
    <ellipse cx="242" cy="250" rx="10" ry="12" fill="#c8bfd8" stroke="#8f87a8" stroke-width="2"/>
    <circle cx="250" cy="246" r="12.5" fill="#b6bfd6" stroke="#8f87a8" stroke-width="2"/>
    <path d="M257 255 C 260 268 253 275 246 273" fill="none" stroke="#b6bfd6" stroke-width="6" stroke-linecap="round"/>
    <path d="M257 255 C 260 268 253 275 246 273" fill="none" stroke="#8f87a8" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <circle cx="253.5" cy="243" r="1.8" fill="#4f4460"/>
    <ellipse cx="242" cy="250" rx="5.5" ry="7.5" fill="#dcc9d6"/>
    <ellipse cx="272" cy="255" rx="10" ry="12" fill="#c8bfd8" stroke="#8f87a8" stroke-width="2"/>
    <circle cx="264" cy="251" r="12.5" fill="#b6bfd6" stroke="#8f87a8" stroke-width="2"/>
    <path d="M257 260 C 254 273 261 279 268 277" fill="none" stroke="#b6bfd6" stroke-width="6" stroke-linecap="round"/>
    <path d="M257 260 C 254 273 261 279 268 277" fill="none" stroke="#8f87a8" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <circle cx="260" cy="248" r="1.8" fill="#4f4460"/>
    <ellipse cx="272" cy="255" rx="5.5" ry="7.5" fill="#dcc9d6"/>
  </g>

  <!-- ark -->
  <g filter="url(#wob)">
    <path d="M124 268 L 276 268 C 274 300 256 326 200 328 C 144 326 126 300 124 268 Z"
          fill="#c9855c" stroke="#8a5638" stroke-width="5" stroke-linejoin="round"/>
    <path d="M136 290 C 170 298 230 298 264 290" fill="none" stroke="#8a5638" stroke-width="2.5" opacity="0.55"/>
    <path d="M146 308 C 175 315 225 315 254 308" fill="none" stroke="#8a5638" stroke-width="2.5" opacity="0.55"/>
    <rect x="162" y="224" width="76" height="46" rx="7" fill="#e2a97c" stroke="#8a5638" stroke-width="4"/>
    <path d="M152 226 L 248 226 L 230 204 L 170 204 Z" fill="#cf7f63" stroke="#8a5638" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="200" cy="247" r="10" fill="#fdf3e3" stroke="#8a5638" stroke-width="3"/>
    <path d="M200 204 V 186" stroke="#8a5638" stroke-width="3" stroke-linecap="round"/>
    <path d="M200 186 L 218 191 L 200 197 Z" fill="#f2a7b3" stroke="#c77f8e" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- front waves -->
  <g filter="url(#wob2)">
    <path d="M0 336 Q 60 328 120 336 T 240 336 T 360 336 Q 380 333 400 336 V400 H0 Z" fill="#7fc0af" opacity="0.85"/>
    <g fill="none" stroke="#67a897" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <path d="M52 356 q 9 -8 18 0"/>
      <path d="M118 368 q 9 -8 18 0"/>
      <path d="M296 360 q 9 -8 18 0"/>
      <path d="M348 374 q 9 -8 18 0"/>
      <path d="M204 352 q 9 -8 18 0"/>
    </g>
  </g>

  <!-- hand frame -->
  <rect x="10" y="10" width="380" height="380" rx="20" fill="none" stroke="#cfb28e" stroke-width="3" filter="url(#wob2)"/>

  <!-- lettering -->
  <text x="200" y="52" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive"
        font-size="30" font-weight="bold" fill="#7a5636" text-anchor="middle"
        transform="rotate(-2 200 45)">NOAH'S ARC</text>
  <text x="200" y="382" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive"
        font-size="13.5" fill="#fdf6ec" text-anchor="middle"
        transform="rotate(1 200 382)">EVERYONE'S BOARDING. TWO BY TWO.</text>

  <!-- paper grain -->
  <rect width="400" height="400" filter="url(#grain)" opacity="0.5"/>
</svg>
